# 의미 계층 (semantic layer) v0.1
#
# 이 파일은 "현업의 말"과 "데이터의 시트·항목"을 이어 주는 사전입니다.
# 에이전트는 실행할 때마다 이 파일을 읽고, 답에 어떤 항목을 썼는지 밝힙니다.
# 틀린 답이 나오면 여기서 해당 항목을 고치면 됩니다. 코드를 건드릴 필요가 없습니다.
#
# 항목마다 붙는 표시
#   status: 기준   = 대시보드가 쓰는 정의. 마케팅팀이 보는 숫자와 같아야 한다.
#           관행   = BA 개인 쿼리에서 확인된 정의.
#           추정   = 시트 정의서의 이름만 보고 짐작한 것. 아직 근거가 약하다.
#   confirmed: BA가 직접 확인했으면 true. 지금은 전부 false다(자료에서 읽어 낸 초안).
#   source: 이 항목의 근거가 된 자료.
#
# 고친 뒤에는 `python layer_check.py` 와 `python run_gold.py --check` 를 돌려 깨진 곳이 없는지 확인하세요.

meta:
  version: "0.1"
  updated: "2026-11-21"
  written_from: [테이블 정의서 35개, BA 개인 쿼리 31개, 대시보드 패널 쿼리 4개와 캡처, 데이터 안내문]

# ---------------------------------------------------------------------------
# 지표: 세거나 더하는 것
# ---------------------------------------------------------------------------
metrics:
  - id: 순매출
    name: 순매출 (대시보드 기준 매출)
    aliases: [매출, 매출액, 순매출, 판매액]
    definition: 일별 매출 요약 시트에 미리 더해 둔 순매출을 합한다.
    calc: "SUM(NET_AMT) FROM NX_AGG1_DSL"
    time: {column: "NX_AGG1_DSL.DT", format: YYYYMMDD}
    split_by: [날짜, 주차, 월, 채널, 카테고리]
    status: 기준
    confirmed: false
    source: [대시보드 패널 1·2·3, "BA 쿼리: 매출_최종_마트, 주간매출_보고용, 채널별매출_월간"]
    notes: 요약 시트에는 모델, 회원, 소모품 여부가 없다. 그 기준으로 나누려면 주문기준순매출을 써야 한다.

  - id: 주문기준순매출
    name: 주문 줄을 직접 더한 순매출
    aliases: [반품 차감 매출, 원천 기준 매출]
    definition: 주문 줄마다 판매 금액에서 할인과 반품·취소 금액을 빼고 합한다.
    calc: "SUM(d.SALE_AMT - d.DC_AMT - COALESCE(r.RTN_AMT, 0)) FROM LX_HJV1_H h JOIN LX_HJV1_D d ON h.ORD_NO = d.ORD_NO LEFT JOIN LX_HJV4_RTN r ON d.ORD_NO = r.ORD_NO AND d.ORD_SEQ = r.ORD_SEQ"
    time: {column: "LX_HJV1_H.ORD_DT", format: YYYYMMDD}
    split_by: [날짜, 주차, 월, 채널, 카테고리, 모델, 상품속성, 회원등급]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 카테고리별_매출, 등급별매출_10월, 냉장고_김치포함, 프린터매출_업무용"]
    notes: 요약 시트로 나눌 수 없는 기준(모델, 회원 등급, 소모품 제외 등)이 필요할 때 쓴다. 일부 BA 쿼리는 소모품 제외(CNSM_YN = 'N')와 HS_YN = 'N' 조건을 더한다.

  - id: 할인차감매출
    name: 할인만 뺀 매출 (반품 차감 전)
    aliases: [반품 차감 전 매출, 총매출]
    definition: 주문 줄의 판매 금액에서 할인만 빼고 합한다. 반품과 취소는 빼지 않는다.
    calc: "SUM(d.SALE_AMT - d.DC_AMT) FROM LX_HJV1_H h JOIN LX_HJV1_D d ON h.ORD_NO = d.ORD_NO"
    time: {column: "LX_HJV1_H.ORD_DT", format: YYYYMMDD}
    split_by: [날짜, 주차, 월, 채널, 카테고리, 모델, 상품속성, 회원등급]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 매출_최종"]
    notes: 이름이 비슷한 '매출_최종_마트'(순매출)와 숫자가 다르다.

  - id: 결제금액
    name: 결제 금액
    aliases: [결제 기준 매출, 결제액]
    definition: 결제 시트의 결제 금액을 합한다.
    calc: "SUM(PAY_AMT) FROM LX_HJV3_PAY"
    time: {column: "LX_HJV3_PAY.PAY_TS", format: "YYYY-MM-DD HH:MM:SS"}
    split_by: [날짜, 월, 결제수단]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 일별매출_결제, 결제수단별"]

  - id: 주문건수
    name: 주문 건수
    aliases: [주문 수, 오더 수]
    definition: 주문 시트에서 주문번호의 개수를 센다.
    calc: "COUNT(DISTINCT ORD_NO) FROM LX_HJV1_H"
    time: {column: "LX_HJV1_H.ORD_DT", format: YYYYMMDD}
    split_by: [날짜, 주차, 월, 채널, 회원등급]
    status: 추정
    confirmed: false
    source: [테이블 정의서, "BA 쿼리: 작년대비_월별"]
    notes: 취소된 주문을 포함할지는 정해진 바가 없다. 답할 때 "확인 필요"에 적는다. 2024-01-01 ~ 2024-11-15 의 건수는 옛 백업 LX_HJV1_H_BAK 에서만 볼 수 있다.

  - id: 주문고객수
    name: 주문한 회원 수
    aliases: [구매 고객 수, 구매자 수]
    definition: 주문 시트에서 회원번호의 개수를 중복 없이 센다.
    calc: "COUNT(DISTINCT MBR_NO) FROM LX_HJV1_H"
    time: {column: "LX_HJV1_H.ORD_DT", format: YYYYMMDD}
    split_by: [날짜, 주차, 월, 채널, 카테고리, 회원등급]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 등급별매출_10월"]

  - id: 쿠폰사용률
    name: 쿠폰 발급 수, 사용 수, 사용률
    aliases: [쿠폰 발급 수, 쿠폰 사용 수, 쿠폰 전환율]
    definition: 프로모션에 묶인 쿠폰의 발급 건수, 그중 사용된 건수, 사용 건수를 발급 건수로 나눈 비율(소수 한 자리).
    calc: "COUNT(*) 발급, COUNT(u.CPN_ID) 사용, ROUND(100.0 * COUNT(u.CPN_ID) / COUNT(*), 1) 사용률 FROM NX_BNF5_PRM pr JOIN NX_BNF5_MAP p ON pr.PRM_ID = p.PRM_ID JOIN LX_BNF2_ISS i ON p.CPN_ID = i.CPN_ID LEFT JOIN LX_BNF3_USE u ON i.CPN_ID = u.CPN_ID AND i.MBR_NO = u.MBR_NO"
    time: {column: "NX_BNF5_PRM.FR_DT", format: YYYYMMDD}
    split_by: [프로모션, 쿠폰]
    status: 기준
    confirmed: false
    source: [대시보드 패널 4, "BA 쿼리: 쿠폰사용률"]
    notes: 대시보드는 프로모션 시작일이 기간 말일 이전인 것만 본다. 사용 시점 조건이 없어서 조회하는 날에 따라 사용 수가 달라질 수 있다. 발급과 사용은 쿠폰과 회원번호 둘 다로 이어야 한다.

  - id: 쿠폰미사용회원수
    name: 쿠폰을 받고 쓰지 않은 회원 수
    aliases: [쿠폰 미사용자, 쿠폰 안 쓴 사람]
    definition: 쿠폰을 발급받았지만 사용 기록이 없는 회원을 중복 없이 센다.
    calc: "COUNT(DISTINCT i.MBR_NO) FROM LX_BNF2_ISS i LEFT JOIN LX_BNF3_USE u ON i.CPN_ID = u.CPN_ID AND i.MBR_NO = u.MBR_NO WHERE u.CPN_ID IS NULL"
    time: {column: "LX_BNF2_ISS.GET_TS", format: YYYYMMDDHHMMSS}
    split_by: [프로모션, 쿠폰]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 쿠폰받고안쓴사람"]
    notes: 어느 쿠폰 또는 프로모션인지가 정해져야 한다.

  - id: 쿠폰할인금액
    name: 쿠폰으로 할인된 금액
    aliases: [쿠폰 비용]
    definition: 정해진 계산식이 없다.
    status: 추정
    confirmed: false
    source: ["BA 쿼리: 쿠폰_할인금액"]
    notes: 그 BA 쿼리는 쿠폰 사용과 주문 줄을 주문번호로만 이어서 건수와 금액이 부풀 수 있다. 이 지표를 요청받으면 "사람 확인 필요"로 넘긴다.

  - id: 신규가입자수
    name: 신규 가입자 수
    aliases: [가입자 수, 신규 회원 수]
    definition: 회원 시트에서 가입일이 기간 안에 드는 회원을 센다.
    calc: "COUNT(*) FROM LX_DNS1_M"
    time: {column: "LX_DNS1_M.JOIN_DT", format: YYYYMMDD}
    split_by: [날짜, 월, 회원등급]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 신규가입_월별"]
    notes: 추출본의 회원은 4,000명 표본이다. 전체 회원 수가 아니다.

  - id: 회원수
    name: 회원 수 (현재 등급 기준)
    aliases: [등급별 회원 수]
    definition: 등급 이력 시트에서 현재 행(종료일 99991231)을 센다.
    calc: "COUNT(*) FROM LX_DNS2_H WHERE TO_DT = '99991231'"
    split_by: [회원등급]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 회원수_등급별"]

  - id: 상품조회수
    name: 상품 조회 수
    aliases: [조회수, 페이지뷰, PV]
    definition: 상품 조회 기록의 줄 수를 센다.
    calc: "COUNT(*) FROM NX_EVL2_PV"
    time: {column: "NX_EVL2_PV.PV_TS", format: "YYYY-MM-DD HH:MM:SS", zone: "UTC로 보임(미확정)"}
    split_by: [날짜, 월, 모델, 카테고리]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 상품조회_TOP20"]

  - id: 방문수
    name: 방문(세션) 수
    aliases: [세션 수, 방문자 수]
    definition: 방문 기록의 줄 수를 센다.
    calc: "COUNT(*) FROM NX_EVL1_SSN"
    time: {column: "NX_EVL1_SSN.SSN_ST_TS", format: "YYYY-MM-DD HH:MM:SS", zone: "UTC로 보임(미확정)"}
    split_by: [날짜, 월, 디바이스]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 세션_디바이스"]
    notes: 로그인하지 않은 방문은 고객 ID가 빈 값이다.

  - id: 검색횟수
    name: 검색 횟수
    aliases: [검색어 순위, 인기 검색어]
    definition: 검색 기록의 줄 수를 검색어별로 센다.
    calc: "COUNT(*) FROM NX_EVL5_SRCH GROUP BY KWD"
    time: {column: "NX_EVL5_SRCH.SRCH_TS", format: "YYYY-MM-DD HH:MM:SS", zone: "UTC로 보임(미확정)"}
    split_by: [날짜, 월, 검색어]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 검색어"]

  - id: 조회후구매
    name: 조회한 고객 중 구매한 고객
    aliases: [구매 전환, 전환율]
    definition: 모델을 조회한 로그인 고객 수와, 그중 같은 모델을 산 고객 수.
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 조회_구매전환_모델"]
    notes: 조회와 구매를 잇는 기간 조건이 쿼리마다 다르다. 기간 조건이 티켓에 없으면 요청자에게 묻는다.

  - id: 장바구니이탈
    name: 장바구니에 담고 사지 않은 고객 수
    aliases: [장바구니 이탈]
    definition: 장바구니에 담긴 채로 남아 있고(뺀 시각이 비어 있음) 그 상품의 주문이 없는 고객을 센다.
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 장바구니_이탈"]
    notes: 뺀 시각(DEL_TS)의 빈 값이 NULL과 빈 문자열로 섞여 있다.

  - id: 푸시반응
    name: 푸시 발송 수, 오픈 수, 클릭 수
    aliases: [푸시 성과, 오픈율, 클릭률]
    definition: 캠페인별 발송 건수와, 그중 연 시각과 누른 시각이 채워진 건수.
    calc: "COUNT(*) 발송, COUNT(NULLIF(r.OPEN_TS, '')) 오픈, COUNT(NULLIF(r.CLICK_TS, '')) 클릭 FROM NX_QPS1_SND s LEFT JOIN NX_QPS3_RSP r ON s.SND_ID = r.SND_ID"
    time: {column: "NX_QPS1_SND.SND_TS", format: "YYYY-MM-DD HH:MM:SS", zone: "UTC로 보임(미확정)"}
    split_by: [캠페인, 날짜, 월]
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 푸시반응"]
    notes: 연 시각과 누른 시각의 빈 값이 NULL과 빈 문자열로 섞여 있어서 NULLIF로 걸러야 한다.

  - id: 푸시대상수
    name: 푸시를 보낼 대상 인원
    aliases: [타깃 수, 발송 대상, 대상 추출]
    definition: 조건에 맞고, 수신에 동의했고, 발송 제한에 걸리지 않는 고객 수.
    status: 관행
    confirmed: false
    source: ["BA 쿼리: 냉장고특가_대상_1119, 푸시대상_기본"]
    notes: 정책 '대상추출'을 반드시 따른다.

# ---------------------------------------------------------------------------
# 나누는 기준: 지표를 무엇별로 볼 수 있는가
# ---------------------------------------------------------------------------
dimensions:
  - id: 날짜
    how: 지표마다 날짜 항목이 다르다(각 지표의 time 참고). 날짜 표기 방식도 시트마다 다르다.
  - id: 주차
    how: "달력 시트 LX_ZCM_DT 의 WK. 날짜(DT)로 잇는다."
    source: ["BA 쿼리: 주간매출_보고용"]
  - id: 월
    how: "달력 시트 LX_ZCM_DT 의 MON, 또는 날짜 문자열의 앞 6자리."
  - id: 채널
    how: "CHNL_CD. 이름은 LX_ZCM_CHNL.CHNL_NM (대시보드 기준). LX_ZCM_CD 의 CD_GRP = 'CHNL' 에도 이름이 있다."
    status: 기준
    source: [대시보드 패널 2]
  - id: 카테고리
    how: "LX_KRP2_C 의 대분류 CAT_L, 중분류 CAT_M, 소분류 CAT_S. 대시보드는 중분류로 묶는다. 요약 시트는 CAT_CD 로, 주문 줄은 상품코드 → 모델 → 카테고리 순으로 잇는다."
    status: 기준
    source: [대시보드 패널 3]
  - id: 모델
    how: "LX_KRP1_M (MDL_CD, MDL_NM). 주문 줄의 상품코드는 LX_KRP3_SKU 로 모델에 잇는다."
  - id: 상품속성
    how: "NX_KRP7_ATTR 의 업무용 여부 BIZ_YN, 소모품 여부 CNSM_YN. 모델코드로 잇는다."
  - id: 회원등급
    how: "등급 코드 GRD_CD, 이름은 LX_ZCM_CD 의 CD_GRP = 'GRD'. BA 쿼리는 등급 이력 LX_DNS2_H 의 현재 행을 쓴다."
    status: 관행
    source: ["BA 쿼리: 회원수_등급별, 등급별매출_10월"]
  - id: 결제수단
    how: "LX_HJV3_PAY.PAY_MTHD, 이름은 LX_ZCM_CD 의 CD_GRP = 'PAY'."
    source: ["BA 쿼리: 결제수단별"]
  - id: 디바이스
    how: "NX_EVL1_SSN.DEVICE, 이름은 LX_ZCM_CD 의 CD_GRP = 'DEVICE'."
    source: ["BA 쿼리: 세션_디바이스"]
  - id: 프로모션
    how: "NX_BNF5_PRM (PRM_ID, PRM_NM, 기간). 쿠폰과는 NX_BNF5_MAP 으로 잇는다."
  - id: 쿠폰
    how: "LX_BNF1_M (CPN_ID, CPN_NM)."
  - id: 캠페인
    how: "푸시 캠페인 ID CMP_ID (NX_QPS1_SND, NX_QPS2_TGT)."
  - id: 검색어
    how: "NX_EVL5_SRCH.KWD."

# ---------------------------------------------------------------------------
# 뜻이 여러 가지인 말: 기본으로 쓸 뜻과 다른 뜻
# ---------------------------------------------------------------------------
terms:
  - term: 매출
    default: 순매출
    others: [주문기준순매출, 할인차감매출, 결제금액]
    rule: 티켓이 기준을 밝혔으면 그 기준을 쓴다. 밝히지 않았으면 순매출로 답하고 다른 기준과의 차이를 "확인 필요"에 적는다. 요약 시트로 나눌 수 없는 기준을 요청하면 주문기준순매출을 쓴다.
  - term: 냉장고
    default: "중분류 CAT_M = '냉장고' (대시보드 기준)"
    others: ["김치냉장고 포함: CAT_M IN ('냉장고', '김치냉장고')", "일반형·양문형만: CAT_CD IN ('C101', 'C102') (BA 쿼리 주석)"]
    rule: 김치냉장고와 업소용 냉장고는 중분류가 따로다. 냉장고 숫자를 답할 때 두 숫자를 따로 알려 준다.
  - term: 회원 등급
    default: "등급 이력 LX_DNS2_H 의 현재 행 (TO_DT = '99991231')"
    others: ["회원 시트 LX_DNS1_M.GRD_CD", "회원 일일 요약 NX_AGG2_MBR_D.GRD_CD"]
    rule: 세 곳의 값이 같은지는 확인되지 않았다.
  - term: 고객
    default: "회원번호 MBR_NO (LX_ 시트)"
    others: ["고객 ID CUST_ID (NX_ 시트)"]
    rule: "둘은 'C' || MBR_NO = CUST_ID 로 잇는다."
  - term: 휴면
    default: 정해진 기준 없음
    others: ["BA 쿼리 '휴면회원_추출'은 2026-05-23 이후 주문이 없는 회원으로 뽑았다"]
    rule: 몇 개월 동안 주문이 없으면 휴면인지 티켓에 없으면 요청자에게 묻는다.

# ---------------------------------------------------------------------------
# 시트를 잇는 규칙
# ---------------------------------------------------------------------------
relations:
  - {from: 주문 줄, to: 주문, "on": "LX_HJV1_D.ORD_NO = LX_HJV1_H.ORD_NO"}
  - {from: 반품·취소, to: 주문 줄, "on": "ORD_NO 와 ORD_SEQ 둘 다", caution: 주문번호만으로 이으면 줄 수만큼 부푼다}
  - {from: 결제, to: 주문, "on": "LX_HJV3_PAY.ORD_NO = LX_HJV1_H.ORD_NO", caution: 한 주문에 결제가 여러 줄일 수 있다}
  - {from: 배송, to: 주문, "on": "NX_HJV6_DLV.ORD_NO = LX_HJV1_H.ORD_NO"}
  - {from: 주문 줄, to: 상품코드, "on": "LX_HJV1_D.SKU_CD = LX_KRP3_SKU.SKU_CD"}
  - {from: 상품코드, to: 모델, "on": "LX_KRP3_SKU.MDL_CD = LX_KRP1_M.MDL_CD"}
  - {from: 모델, to: 카테고리, "on": "LX_KRP1_M.CAT_CD = LX_KRP2_C.CAT_CD"}
  - {from: 모델, to: 상품속성, "on": "LX_KRP1_M.MDL_CD = NX_KRP7_ATTR.MDL_CD"}
  - {from: 회원, to: 고객 ID, "on": "'C' || MBR_NO = CUST_ID", caution: "LX_ 시트는 회원번호(숫자), NX_ 시트는 고객 ID(문자)를 쓴다"}
  - {from: 상품 조회, to: 방문, "on": "NX_EVL2_PV.SSN_ID = NX_EVL1_SSN.SSN_ID", caution: 조회 기록에는 고객 ID가 없어 방문 기록을 거쳐야 한다}
  - {from: 쿠폰 사용, to: 쿠폰 발급, "on": "CPN_ID 와 MBR_NO 둘 다"}
  - {from: 쿠폰, to: 프로모션, "on": "NX_BNF5_MAP 의 PRM_ID, CPN_ID"}
  - {from: 푸시 반응, to: 푸시 발송, "on": "NX_QPS3_RSP.SND_ID = NX_QPS1_SND.SND_ID"}
  - {from: 요약 매출, to: 채널·카테고리, "on": "NX_AGG1_DSL.CHNL_CD, NX_AGG1_DSL.CAT_CD"}
  - {from: 코드, to: 코드 이름, "on": "LX_ZCM_CD 에서 CD_GRP(코드 종류)와 CD(코드)로 찾는다"}

# ---------------------------------------------------------------------------
# 데이터에 없는 것: 요청이 여기에 해당하면 "불가"
# ---------------------------------------------------------------------------
gaps:
  - id: 배송유형
    asked_as: [새벽배송, 당일배송, 익일배송, 설치배송, 배송 방식]
    why: 배송 시트 NX_HJV6_DLV 에는 주문번호, 배송 상태, 시각만 있다. 배송 방식을 가리는 항목이 없다.
    instead: 배송 상태별 건수는 볼 수 있다. 배송 시각으로 배송 방식을 짐작해 만들지 않는다.
    source: [테이블 정의서]
  - id: 인구통계
    asked_as: [연령, 연령대, 나이, 성별, 생년]
    why: 회원 시트에는 회원번호, 가입일, 등급, 가려진 이름과 전화번호만 있다.
    instead: 등급별, 가입 시기별로는 나눌 수 있다.
    source: [테이블 정의서]
  - id: 지역
    asked_as: [지역, 시도, 주소, 수도권, 배송지]
    why: 주소나 지역을 담은 항목이 어느 시트에도 없다.
    instead: 채널별로는 나눌 수 있다.
    source: [테이블 정의서]
  - id: 원가와마진
    asked_as: [원가, 마진, 마진율, 이익, 수익성]
    why: 판매 금액과 할인 금액은 있지만 원가가 없다.
    instead: 할인 금액과 할인율은 볼 수 있다.
    source: [테이블 정의서]
  - id: 그밖에없는것
    asked_as: [재고, 품절, 리뷰, 평점, 광고비, ROAS, 유입 경로, 앱 설치 수]
    why: 해당하는 시트가 없다.
    source: [테이블 정의서]
  - id: 2025년주문
    asked_as: [작년 대비, 전년 대비, 전년 동기, 2025년, YoY]
    why: 주문 계열 시트는 2026-05-01 이후분만 있고, 옛 백업 LX_HJV1_H_BAK 은 2024-11-15 에서 멈췄다. 2025년 주문은 어디에도 없다.
    instead: 2024-01-01 ~ 2024-11-15 의 주문 건수는 옛 백업으로 볼 수 있다(금액과 상품은 없음).
    source: [데이터 안내문, "BA 쿼리: 작년대비_월별 (2024년을 작년으로 본 낡은 쿼리)"]
  - id: 주문상세이전분
    asked_as: [올해 1월부터, 상반기, 연초부터, 1분기]
    why: 주문 계열 시트는 2026-05-01 이후분만 있다. 그 이전은 아카이브라 추출에서 빠졌다.
    instead: 2026-05-01 이후 구간만 답할 수 있다("부분 가능").
    source: [데이터 안내문]

# ---------------------------------------------------------------------------
# 정책: 판정을 가르는 규칙
# ---------------------------------------------------------------------------
policies:
  - id: 대상추출
    rule: 푸시나 문자를 보낼 대상을 뽑아 달라거나 그 대상이 몇 명인지 묻는 요청은 (1) 조회나 구매를 볼 기간 (2) 상품 범위 (3) 이미 산 고객을 뺄지 중 티켓에 없는 것이 하나라도 있으면 "정보 부족"이다. 성과 보고용으로 단순히 인원을 세는 요청에는 적용하지 않는다. 조건별 인원수를 표로 계산해 질문과 함께 보여 준다. 수신 동의(NX_DNS5_AGR.PUSH_YN = 'Y')와 발송 제한(NX_QPS9_LMT, 과거 쿼리는 7일 2회)은 항상 적용한다.
    source: ["BA 쿼리: 냉장고특가_대상_1119 의 주석(요청자 확인을 거친 조건)"]
  - id: 개인명단
    rule: 회원번호, 고객 ID, 이름, 연락처처럼 개인을 식별하는 목록을 달라는 요청은 "사람 확인 필요"다. 목록은 조회하지 않고 인원수와 SQL 초안만 낸다.
  - id: 임시표
    rule: TMP_ 로 시작하는 시트는 개인이 만든 임시 표다. 여기에 기대야 하는 요청은 "사람 확인 필요"다.
    source: ["BA 쿼리: 이거쓰지마, 쿠폰_0915_수정"]
  - id: 백업표
    rule: _BAK 로 끝나는 시트는 옛 백업이다. 2024년 주문 건수를 볼 때만 쓰고 "확인 필요"에 적는다.
  - id: 대체정의금지
    rule: 이 사전과 과거 쿼리에 없는 정의를 스스로 만들어 판정의 근거로 쓰지 않는다. 비슷하게라도 볼 방법이 있으면 회신 초안의 "대안"에만 적는다.
  - id: 기간없음
    rule: 지표 요청에 기간만 빠졌으면 데이터가 있는 전체 기간으로 답하고 그 기간을 밝힌다. 대상 추출에는 이 규칙을 쓰지 않는다.
  - id: 모호한지표
    rule: 무엇을 세거나 더할지 알 수 없는 요청("잘 되고 있는지", "반응이 어떤지")은 "정보 부족"이다. 볼 수 있는 지표 후보를 질문과 함께 제시한다.
  - id: 사전밖
    rule: 요청한 지표가 이 사전에 없고 '데이터에 없는 것'에도 없으면, 시트를 직접 확인해 판정하되 답의 해석 줄에 "사전 밖"이라고 적는다.

# ---------------------------------------------------------------------------
# 아직 모르는 것: 근거로 쓸 때는 "확인 필요"에 적는다
# ---------------------------------------------------------------------------
unknowns:
  - HS_YN 의 뜻이 확인되지 않았다. 이 항목으로 걸러 달라는 요청은 "사람 확인 필요"다.
  - NX_ 시트의 시각이 UTC로 저장됐는지 확정되지 않았다. BA 쿼리 한 건이 한국 날짜의 경계를 전날 15:00:00 으로 잘랐다.
  - 요약 시트 NX_AGG1_DSL 의 순매출이 주문 줄에서 어떻게 계산되는지 확인되지 않았다.
  - 주문 건수에 취소 주문을 포함하는지 정해지지 않았다.
  - 회원 일일 요약 NX_AGG2_MBR_D 의 ORD_CNT 가 누적 횟수인지 확인되지 않았다.
  - 채널 이름이 LX_ZCM_CHNL 과 LX_ZCM_CD 에서 같은지 확인되지 않았다.

# ---------------------------------------------------------------------------
# 데이터가 있는 기간 (데이터 안내문 기준. 에이전트는 실제 최소·최대 날짜를 다시 확인한다)
# ---------------------------------------------------------------------------
availability:
  - {what: "주문 계열 (LX_HJV1_H, LX_HJV1_D, LX_HJV3_PAY, LX_HJV4_RTN)", period: "2026-05-01 ~ 추출 전날(2026-11-19)"}
  - {what: "옛 주문 백업 (LX_HJV1_H_BAK)", period: "~ 2024-11-15. 주문 헤더만 있고 금액과 상품은 없다"}
  - {what: "행동 로그 (NX_EVL*)", period: "~ 2026-11-19. 시작일은 직접 확인한다"}
  - {what: "수신 동의, 푸시 발송 이력", period: "~ 2026-11-20 18:00"}
  - {what: "회원", period: "분석용 표본 4,000명"}

# ---------------------------------------------------------------------------
# 시트와 항목의 뜻 (정의서 35개 전부). 새 시트나 항목이 생기면 layer_check.py 가 여기와 비교해 알려 준다.
# ---------------------------------------------------------------------------
tables:
  LX_HJV1_H:
    name: 주문
    group: 주문
    columns: {ORD_NO: 주문번호, MBR_NO: 회원번호, ORD_DT: "주문일 (YYYYMMDD)", CHNL_CD: 채널 코드, ORD_STAT: 주문 상태 코드}
  LX_HJV1_D:
    name: 주문 줄 (주문에 담긴 상품)
    group: 주문
    columns: {ORD_NO: 주문번호, ORD_SEQ: 주문 안의 줄 번호, SKU_CD: 상품코드, QTY: 수량, SALE_AMT: "판매 금액 (할인 전)", DC_AMT: 할인 금액}
  LX_HJV3_PAY:
    name: 결제
    group: 주문
    columns: {ORD_NO: 주문번호, PAY_MTHD: 결제수단 코드, PAY_AMT: 결제 금액, PAY_TS: "결제 시각 (YYYY-MM-DD HH:MM:SS)"}
  LX_HJV4_RTN:
    name: 반품·취소
    group: 주문
    columns: {ORD_NO: 주문번호, ORD_SEQ: 주문 안의 줄 번호, RTN_TP: 반품 유형 코드, RTN_AMT: 반품 금액, RTN_DT: "반품일 (YYYYMMDD)"}
  NX_HJV6_DLV:
    name: 배송 상태
    group: 주문
    columns: {ORD_NO: 주문번호, DLV_STAT: 배송 상태 코드, DLV_TS: 배송 상태가 바뀐 시각}
    notes: BA 쿼리에 쓰인 적이 없다. 배송 방식(새벽배송 등)을 가리는 항목이 없다.
  LX_HJV1_H_BAK:
    name: 옛 주문 백업
    group: 주문
    columns: {ORD_NO: 주문번호, MBR_NO: 회원번호, ORD_DT: "주문일 (YYYYMMDD)", CHNL_CD: 채널 코드, ORD_STAT: 주문 상태 코드}
    notes: 2024-11-15 에서 멈춘 백업. 주문 줄(금액, 상품)의 백업은 없다.
  LX_KRP1_M:
    name: 모델
    group: 상품
    columns: {MDL_CD: 모델코드, MDL_NM: 모델 이름, CAT_CD: 카테고리 코드, LNCH_DT: "출시일 (YYYYMMDD)"}
  LX_KRP2_C:
    name: 카테고리
    group: 상품
    columns: {CAT_CD: 카테고리 코드, CAT_L: 대분류, CAT_M: 중분류, CAT_S: 소분류}
  LX_KRP3_SKU:
    name: 상품코드 (색상·용량별 상품)
    group: 상품
    columns: {SKU_CD: 상품코드, MDL_CD: 모델코드, COLOR: 색상, CAP: 용량}
  NX_KRP4_PRC:
    name: 가격 이력
    group: 상품
    columns: {SKU_CD: 상품코드, PRC: 가격, FR_TS: 적용 시작 시각, TO_TS: 적용 끝 시각}
    notes: BA 쿼리에 쓰인 적이 없다.
  NX_KRP7_ATTR:
    name: 모델 속성
    group: 상품
    columns: {MDL_CD: 모델코드, BIZ_YN: 업무용 여부, CNSM_YN: 소모품 여부, HS_YN: 뜻이 확인되지 않음}
  LX_DNS1_M:
    name: 회원
    group: 회원
    columns: {MBR_NO: 회원번호, JOIN_DT: "가입일 (YYYYMMDD)", GRD_CD: 등급 코드, NM_MSK: "이름 (가려짐, 개인정보)", TEL_MSK: "전화번호 (가려짐, 개인정보)"}
  LX_DNS2_H:
    name: 등급 이력
    group: 회원
    columns: {MBR_NO: 회원번호, GRD_CD: 등급 코드, FR_DT: 시작일, TO_DT: "종료일 (현재 행은 99991231)"}
  NX_DNS5_AGR:
    name: 수신 동의
    group: 회원
    columns: {CUST_ID: "고객 ID ('C' + 회원번호)", PUSH_YN: 푸시 수신 동의, SMS_YN: 문자 수신 동의, UPD_TS: 바뀐 시각}
  LX_BNF1_M:
    name: 쿠폰
    group: 쿠폰
    columns: {CPN_ID: 쿠폰 ID, CPN_NM: 쿠폰 이름, DC_TP: "할인 방식 코드 (추정)", DC_VAL: 할인 값}
  LX_BNF2_ISS:
    name: 쿠폰 발급
    group: 쿠폰
    columns: {CPN_ID: 쿠폰 ID, MBR_NO: 회원번호, GET_TS: "받은 시각 (YYYYMMDDHHMMSS)", EXP_DT: 만료일}
  LX_BNF3_USE:
